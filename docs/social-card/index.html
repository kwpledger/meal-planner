<meta charset="utf-8">
<title>meal-planner.kwpledger.com social card — 1200×630</title>
<style>
  @font-face { font-family:'Lora'; src:url('../../node_modules/@kwpledger/design/fonts/lora-latin.woff2') format('woff2');
               font-weight:600; font-style:normal; }
  @font-face { font-family:'Hanken Grotesk'; src:url('../../node_modules/@kwpledger/design/fonts/hanken-grotesk-latin.woff2') format('woff2');
               font-weight:100 900; font-style:normal; }

  :root{
    /* ---- DARK REGISTER, pinned — docs/social-card-design-system.md §1 ---- */
    --surface:#0a1420; --fg:#e6ecf2; --fg-muted:#9aabbb;
    --accent:#5fbdb4; --border:#1e3245;
    --font-display:'Lora',Georgia,'Iowan Old Style',Palatino,serif;
    --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }

  *{box-sizing:border-box; margin:0;}
  body{margin:0; background:#555;}

  .card{
    width:1200px; height:630px; overflow:hidden;
    padding:80px 96px;
    background:var(--surface); color:var(--fg); font-family:var(--font-body);
    display:flex; flex-direction:column; justify-content:space-between;
  }
  h1{font-family:var(--font-display); font-weight:600; font-size:64px;
     line-height:1.12; max-width:17ch;}
  h1 em{font-style:normal; color:var(--accent);}   /* no italics — Lora ships 600 only */

  footer{display:flex; align-items:center; justify-content:space-between;
         border-top:1px solid var(--border); padding-top:32px;}
  .who{font-size:26px; line-height:1.3;}
  .who strong{display:block; font-weight:600;}
  .who span{color:var(--fg-muted);}
  /* Inverted ringed long mark, ring #5fbdb4 — §4. Placed as-is, never redrawn. */
  .mark{height:96px; width:auto; display:block;}
</style>

<div class="card">
  <h1>A written diet plan was not something I could actually <em>read&nbsp;at&nbsp;6am.</em></h1>
  <footer>
    <div class="who"><strong>Kevin Pledger</strong><span>meal-planner.kwpledger.com</span></div>
    <img class="mark" src="../../node_modules/@kwpledger/design/logos/logo_long_ring_inv_teal.svg" alt="">
  </footer>
</div>
