# Keeps the free-tier Supabase project from auto-pausing.
#
# Supabase pauses free-tier projects after ~7 days of inactivity, and a paused
# project surfaces in the app as a bare "TypeError: Failed to fetch" - no CORS
# error, no 4xx/5xx, because nothing is listening. Resuming is a manual
# dashboard click. This workflow generates activity on a schedule so the
# inactivity clock never runs out.
#
# WHY THIS WRITES RATHER THAN READS. The first version issued a read
# (select=id&limit=1) and was deliberately read-only so it could never touch
# the synced board. It ran successfully three times and Supabase still sent a
# scheduled-for-pause warning - and Supabase's own API log showed the requests
# arriving with 200s, so they were not failing silently. Whatever their pause
# metric watches, HTTP reads did not appear to move it. Writes are the common
# thread in every workaround other users report, which points at data change -
# WAL, storage - rather than request count. The exact threshold is not
# documented; this is inference from the one experiment available, not a
# quoted rule.
#
# The safety property is preserved by target, not by verb: this writes to a
# dedicated `keepalive` table and never to `meal_plan_sync`. It updates one
# pre-existing row rather than inserting - in Postgres an UPDATE writes a new
# tuple and marks the old one dead, so a single row produces the same physical
# churn as insert-then-delete without the table ever growing. The anon key has
# no insert or delete policy on that table, so this cannot add or remove rows
# even if it tried.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL                 same value as VITE_SUPABASE_URL
#   SUPABASE_PUBLISHABLE_KEY     same value as VITE_SUPABASE_PUBLISHABLE_KEY
# Neither is truly confidential - both already ship inside the public client
# bundle (see docs/ARCHITECTURE.md) - but they stay out of the repo regardless.

name: Supabase keep-alive

on:
  schedule:
    # Daily at 12:00 UTC. Twice weekly was tidiness for its own sake: the job
    # takes seconds on a public repo where Actions minutes are unlimited, so
    # there is nothing to conserve. Daily also covers the possibility that the
    # pause metric is volume-based rather than recency-based, and leaves a
    # week of margin if GitHub delays or drops a scheduled run (they are
    # best-effort, not guaranteed).
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write to Supabase keepalive row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          # Fail loudly on missing secrets. Without this the curl would run
          # against an empty URL and the job could still look green - the exact
          # failure mode this workflow exists to prevent, where the keep-alive
          # is silently dead but appears handled.
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_PUBLISHABLE_KEY repository secrets are not set."
            exit 1
          fi

          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # curl's own exit code has to be captured rather than left to `set -e`:
          # an already-paused project refuses the connection, so curl exits
          # non-zero with no HTTP status at all. Letting that abort the script
          # would lose the diagnostic below - which is the single most useful
          # thing this job can tell you.
          curl_rc=0
          status=$(curl --silent --show-error --location \
            --request PATCH \
            --max-time 30 \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"pinged_at\":\"${now}\"}" \
            "${SUPABASE_URL}/rest/v1/keepalive?id=eq.ping") || curl_rc=$?

          if [ "${curl_rc}" -ne 0 ]; then
            echo "::error::Could not reach Supabase at all (curl exit ${curl_rc}). The project is most likely already paused - resume it from the Supabase dashboard."
            exit 1
          fi

          echo "HTTP ${status}"

          # PostgREST answers a successful PATCH with 204 No Content. Anything
          # else means the project is up but the request was rejected - a
          # changed key, a missing table, or a missing update policy - which is
          # a different fix from a paused project.
          if [ "${status}" != "204" ]; then
            echo "::error::Reached Supabase but got HTTP ${status} instead of 204. The project is up, so check the SUPABASE_PUBLISHABLE_KEY secret, that the keepalive table still exists, and that its update policy is intact."
            exit 1
          fi

          echo "keepalive row updated at ${now}; write activity recorded."
