# Notice when kwpledger-design cuts a release this repo has not taken.
#
# WHY THIS LIVES IN THE CONSUMER AND NOT IN kwpledger-design. The obvious
# design is one check in the design repo, walking a list of consumers. It does
# not work: kwpledger-design is public and two of its consumers are private, so
# a check running there would need a cross-repo credential stored in a PUBLIC
# repo's secrets just to read a pin. Running in the consumer needs no secret at
# all — it reads its own package.json and makes an unauthenticated read against
# a public repo. Measured before it was written; see kwpledger-site's
# docs/ROADMAP.md.
#
# THIS NEVER BUMPS ANYTHING, AND MUST NOT LEARN TO. Consumers take a pinned
# dependency precisely so one bad deploy cannot restyle every property at once.
# Automatic propagation is the thing pinning exists to prevent. This opens an
# issue; a human merges.
#
# IT ALSO OFFERS A BACKLOG LINE, AS A PR. Sessions read docs/BACKLOG.md, not
# Issues, so an issue alone was a report filed where nobody looks: runbox-mcp
# and meal-planner both sat a release behind with the issue open and the
# backlog silent. The PR adds one open item to the end of `## To Do (design) ##`
# — never Current sprint, and never ahead of planned work — and a human merges
# that too. It touches the backlog only, never package.json.
#
# `push` IS HERE AS WELL AS `schedule` ON PURPOSE. GitHub disables scheduled
# workflows in a repo with no activity for 60 days, and a disabled poll reports
# exactly what a poll finding nothing reports — silence. A repo you are pushing
# to re-checks on every push and so cannot go quietly stale.

name: Design system drift

on:
  schedule:
    # Mondays, 13:17 UTC. Off the hour because every cron set to :00 fires into
    # the same stampede and gets queued.
    - cron: '17 13 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: design-drift
  cancel-in-progress: false

jobs:
  check:
    name: Compare the pin against the latest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned version
        id: pin
        run: |
          set -euo pipefail
          SPEC=$(node -p "require('./package.json').dependencies?.['@kwpledger/design'] ?? ''")
          if [ -z "$SPEC" ]; then
            echo "No @kwpledger/design dependency in package.json — nothing to check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # "github:kwpledger/kwpledger-design#v0.6.0" -> "v0.6.0"
          PINNED=${SPEC##*#}
          if ! echo "$PINNED" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::warning::Pinned to '$PINNED', which is not a release tag. Nothing to compare against."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Pinned at $PINNED"
          echo "version=$PINNED" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Find the latest release
        id: latest
        if: steps.pin.outputs.skip == 'false'
        run: |
          set -euo pipefail
          # ls-remote asks the remote, which is what the question was about. A
          # local `git tag` prints an empty list in a fresh clone whether or not
          # releases exist — a mistake already made once, in another repo.
          # `|| true` because `set -o pipefail` plus a grep that matches nothing
          # would abort here with exit 1, losing the diagnosis below.
          LATEST=$(git ls-remote --tags https://github.com/kwpledger/kwpledger-design \
            | sed 's#.*refs/tags/##; s#\^{}$##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -u -V \
            | tail -1 || true)

          if [ -z "$LATEST" ]; then
            echo "::error::No version tags found on kwpledger-design. Either the"
            echo "::error::remote is unreachable or the tag naming changed."
            exit 1
          fi

          echo "Latest release is $LATEST"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Open, update, or close the drift issue
        id: issue
        if: steps.pin.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.pin.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          TITLE='Design system: newer version available'

          # One issue, reused. The title is fixed so it can be found again; the
          # versions live in the body, which gets rewritten each run.
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                  --jq 'map(select(.title == "'"$TITLE"'")) | .[0].number // empty')

          # Ordering, not string equality: a pin ahead of the newest tag (a
          # release cut and then deleted) must not read as "behind".
          NEWEST=$(printf '%s\n%s\n' "$PINNED" "$LATEST" | sort -u -V | tail -1)
          if [ "$NEWEST" = "$PINNED" ]; then
            echo "Pinned at $PINNED; latest is $LATEST. Nothing to do."
            echo "behind=false" >> "$GITHUB_OUTPUT"
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" \
                --comment "Now pinned at \`$PINNED\`. Closing — this repo is current."
            fi
            exit 0
          fi

          # Built with echo rather than a heredoc: YAML block scalars re-indent
          # heredoc bodies. Same reason kwpledger-design's release.yml does.
          {
            echo "This repo is pinned at \`$PINNED\`. The latest release of"
            echo "[kwpledger-design](https://github.com/kwpledger/kwpledger-design/releases) is \`$LATEST\`."
            echo
            echo 'Nothing is broken by this on its own — pinning means the older'
            echo 'tokens keep working. It is here so the gap is visible rather than'
            echo 'discovered later.'
            echo
            echo 'To take it:'
            echo
            echo '```bash'
            echo "npm install github:kwpledger/kwpledger-design#$LATEST --save"
            echo '```'
            echo
            echo '**Check the lockfile, not the spec.** Editing the version in'
            echo '`package.json` can leave `package-lock.json` resolved to the old'
            echo 'commit while the build stays green and every token stays stale.'
            echo 'Confirm the resolved SHA moved, and that the installed files'
            echo 'contain what the new version claims to add.'
            echo
            echo 'Read the release notes before merging: a major bump can rename or'
            echo 'remove a token, which is exactly what pinning exists to catch.'
            echo
            echo '<sub>Opened automatically by `.github/workflows/design-drift.yml`.'
            echo 'It closes itself once the pin catches up.</sub>'
          } > "$RUNNER_TEMP/body.md"

          if [ -n "$NUM" ]; then
            echo "Updating issue #$NUM."
            gh issue edit "$NUM" --body-file "$RUNNER_TEMP/body.md"
          else
            echo "Opening a new issue."
            URL=$(gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.md")
            NUM=${URL##*/}
          fi
          echo "behind=true" >> "$GITHUB_OUTPUT"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      # Needs Settings → Actions → General → "Allow GitHub Actions to create and
      # approve pull requests". Without it `gh pr create` fails here, after the
      # issue step has already done its job, so the run goes red rather than
      # the gap going quiet.
      - name: Offer the backlog line as a PR
        if: steps.pin.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.pin.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
          BEHIND: ${{ steps.issue.outputs.behind }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          # The branch belongs to this workflow and is rebuilt from main every
          # run, so it is force-pushed. Edit the PR's content on main instead.
          BRANCH='design-drift/backlog'
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ "$BEHIND" != 'true' ]; then
            if [ -n "$PR" ]; then
              gh pr close "$PR" --delete-branch \
                --comment "Now pinned at \`$PINNED\`. Closing — nothing to add to the backlog."
            fi
            exit 0
          fi

          # One open item, rewritten in place when a newer release arrives, so
          # three releases behind is still one line. Appended last in its
          # section: order is priority, and this must not jump planned work.
          # The section is created at the end of the file if the repo has none.
          node -e '
            const fs = require("fs");
            const { LATEST, PINNED, ISSUE } = process.env;
            const HEADING = "## To Do (design) ##";
            const item = "Take `kwpledger-design` " + LATEST + "; this repo pins " + PINNED +
              ". Issue #" + ISSUE + " has the steps, and closes itself once the pin catches up.";
            const lines = fs.readFileSync("docs/BACKLOG.md", "utf8").replace(/\n+$/, "").split("\n");

            let start = lines.findIndex(l => l.trim() === HEADING);
            if (start < 0) {
              lines.push("", "", HEADING, "", "Nothing open.", "", "**Completed Items**", "", "(none)");
              start = lines.length - 7;
            }
            let end = lines.findIndex((l, i) => i > start && l.startsWith("## "));
            if (end < 0) end = lines.length;
            let openEnd = lines.findIndex((l, i) => i > start && i < end && l.trim() === "**Completed Items**");
            if (openEnd < 0) openEnd = end;

            const ITEM = /^- \[ \] \*\*(\d+)\.\*\* /;
            const existing = lines.findIndex((l, i) => i > start && i < openEnd &&
              ITEM.test(l) && l.includes("Take `kwpledger-design` v"));
            if (existing >= 0) {
              lines[existing] = lines[existing].match(ITEM)[0] + item;
            } else {
              let count = 0, last = -1;
              for (let i = start + 1; i < openEnd; i++) {
                if (ITEM.test(lines[i])) count++;
                if (/^(- |\s+- )/.test(lines[i])) last = i;
              }
              const line = "- [ ] **" + (count + 1) + ".** " + item;
              const empty = lines.findIndex((l, i) => i > start && i < openEnd &&
                /^(Nothing open\.|\(none\))$/.test(l.trim()));
              if (last >= 0) lines.splice(last + 1, 0, line);
              else if (empty >= 0) lines[empty] = line;
              else lines.splice(start + 1, 0, "", line);
            }
            fs.writeFileSync("docs/BACKLOG.md", lines.join("\n") + "\n");
          '

          if git diff --quiet -- docs/BACKLOG.md; then
            echo "The backlog on main already offers $LATEST."
            if [ -n "$PR" ]; then
              gh pr close "$PR" --delete-branch --comment "Main already lists \`$LATEST\`."
            fi
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git commit -q -am "Backlog: take kwpledger-design $LATEST"
          git push -q --force origin "$BRANCH"

          # echo rather than a heredoc, for the reason given in the step above.
          {
            echo "Adds one open item to \`docs/BACKLOG.md\` under *To Do (design)*:"
            echo "take \`kwpledger-design\` \`$LATEST\` (pinned at \`$PINNED\`). See #$ISSUE."
            echo
            echo 'Merging this changes the backlog only. Taking the release is'
            echo 'still its own PR, which ticks this item when it lands.'
            echo
            echo '<sub>Opened automatically by `.github/workflows/design-drift.yml`.'
            echo 'Rewritten by each run while behind; closes itself once current.</sub>'
          } > "$RUNNER_TEMP/pr.md"

          TITLE="Backlog: take kwpledger-design $LATEST"
          if [ -n "$PR" ]; then
            echo "Updating PR #$PR."
            gh pr edit "$PR" --title "$TITLE" --body-file "$RUNNER_TEMP/pr.md"
          else
            echo "Opening a PR."
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr.md"
          fi
