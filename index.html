<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kevin’s Visual Meal Planner</title>
    <meta name="description" content="A visual meal-plan board, because a written diet plan was not something I could actually read at 6am." />
    <!--
      Link previews (LinkedIn, iMessage, Slack). Modelled on kwpledger-site's
      BaseLayout.astro. og:image must be absolute: crawlers don't resolve a
      relative URL against the page. The card's source and how to re-render it
      are in docs/social-card/.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kevin’s Visual Meal Planner" />
    <meta property="og:description" content="A visual meal-plan board, because a written diet plan was not something I could actually read at 6am." />
    <meta property="og:url" content="https://meal-planner.kwpledger.com/" />
    <meta property="og:site_name" content="Kevin Pledger" />
    <meta property="og:image" content="https://meal-planner.kwpledger.com/og/meal-planner.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A written diet plan was not something I could actually read at 6am. Kevin Pledger, meal-planner.kwpledger.com." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://meal-planner.kwpledger.com/og/meal-planner.png" />
    <meta name="twitter:image:alt" content="A written diet plan was not something I could actually read at 6am. Kevin Pledger, meal-planner.kwpledger.com." />
  </head>
  <body>
    <!--
      THEME, BEFORE FIRST PAINT. This must be an inline, render-blocking script
      in <body> and must run before React mounts, or the page paints in the
      wrong register and visibly snaps - the "flash of wrong theme". A module
      script is deferred by definition, so main.jsx is far too late.

      Kept in sync with src/theme.js by hand, deliberately: importing a module
      here would defer it and reintroduce the flash this exists to prevent. The
      duplicated logic is four lines and the key is the shared constant.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('kwp-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          /* Private mode throws on access. Fall through to system preference. */
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
